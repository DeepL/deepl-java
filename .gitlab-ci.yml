# Note: This GitLab CI configuration is used for internal testing, users can ignore it.
include:
  - project: '${CI_PROJECT_NAMESPACE}/ci-libs-for-client-libraries'
    file:
      - '/${CI_PROJECT_NAME}/.gitlab-ci.yml'
  - project: 'deepl-org/deepl/devex/gitlab-ci-lib'
    file:
      - '/templates/.secret-detection.yml'
  - template: Security/SAST.gitlab-ci.yml

# Global --------------------------

# Use 17 (LTS) as base
image: eclipse-temurin:17-alpine

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  JAVA_TOOL_OPTIONS: ""
  GITLAB_ADVANCED_SAST_ENABLED: 'true'

workflow:
  rules:
    # The tag pipeline must run: that is where the registry publish job fires.
    - if: $CI_COMMIT_TAG
    # The release commit carries only the version and the changelog, both
    # derived from commits that were already checked on the way in.
    - if: $CI_COMMIT_MESSAGE =~ /^chore\(release\):/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

stages:
  - check
  - build
  - test
  - publish

before_script:
  - GRADLE_USER_HOME="$(pwd)/.gradle"
  - export GRADLE_USER_HOME

# stage: check ----------------------

.spotless_base:
  stage: check
  script: ./gradlew spotlessCheck

spotless_scheduled:
  extends: .spotless_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  retry: 2

spotless_manual:
  extends: .spotless_base
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

.license_check_base:
  stage: check
  script:
    - ./license_checker.sh '*.java' | tee license_check_output.txt
    - '[ ! -s license_check_output.txt ]'

license_check_scheduled:
  extends: .license_check_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  retry: 2

license_check_manual:
  extends: .license_check_base
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

secret_detection:
  extends: .secret-detection
  stage: check
  image: !reference [.secret-detection, image]
  variables:
    SECRET_DETECTION_HISTORIC_SCAN: "true"
  before_script:
    - echo "overriding default before_script..."
  rules:
    - if: $CI_MERGE_REQUEST_ID

gitlab-advanced-sast:
  stage: check
  rules:
    - when: always
  variables:
    SAST_EXCLUDED_PATHS: '$DEFAULT_SAST_EXCLUDED_PATHS'
    GIT_STRATEGY: clone

semgrep-sast:
  stage: check
  rules:
    - when: always
  variables:
    SAST_EXCLUDED_PATHS: '$DEFAULT_SAST_EXCLUDED_PATHS'
    GIT_STRATEGY: clone

# stage: build ----------------------

.build_base:
  stage: build
  script:
    - ./gradlew assemble
  artifacts:
    paths:
      - deepl-java/build/

build_scheduled:
  extends: .build_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  retry: 2

build_manual:
  extends: .build_base
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

# stage: test -------------------------

.test_offline_base:
  stage: test
  variables:
    KUBERNETES_MEMORY_LIMIT: 8Gi
  parallel:
    matrix:
      - DOCKER_IMAGE: "eclipse-temurin:18-alpine"
      - DOCKER_IMAGE: "amazoncorretto:8-alpine"
      - DOCKER_IMAGE: "eclipse-temurin:8-focal"
      - DOCKER_IMAGE: "eclipse-temurin:11-alpine"
      - DOCKER_IMAGE: "eclipse-temurin:17-alpine"
      - DOCKER_IMAGE: "eclipse-temurin:19-alpine"
      - DOCKER_IMAGE: "eclipse-temurin:21-alpine"
  image: ${DOCKER_IMAGE}
  script:
    - ./gradlew offlineTest
  artifacts:
    paths:
      - deepl-java/build/reports/jacoco/offlineTestCoverage
    reports:
      coverage_report:
        coverage_format: jacoco
        path: deepl-java/build/reports/jacoco/offlineTestCoverage/offlineTestCoverage.xml
      junit:
        - deepl-java/build/test-results/offlineTest/TEST-*.xml
    when: always

test_offline_scheduled:
  extends: .test_offline_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  retry: 2

test_offline_manual:
  extends: .test_offline_base
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

# Every endpoint once against the real API; no retry, as a retry repeats every request.
# Java 21 is the current LTS. Gradle 7.4.2 officially supports up to Java 17, but this build runs
# on 21 (offline matrix and this job).
.test_real_api_base:
  stage: test
  extends: .test
  # Replaces the deepl-mock service of .test
  services: []
  variables:
    KUBERNETES_MEMORY_LIMIT: 8Gi
  image: eclipse-temurin:21-alpine
  script:
    - ./gradlew realApiTest
  artifacts:
    paths:
      - deepl-java/build/reports/jacoco/realApiTestCoverage
    reports:
      coverage_report:
        coverage_format: jacoco
        path: deepl-java/build/reports/jacoco/realApiTestCoverage/realApiTestCoverage.xml
      junit:
        - deepl-java/build/test-results/realApiTest/TEST-*.xml
    when: always

test_real_api_scheduled:
  extends: .test_real_api_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

test_real_api_manual:
  extends: .test_real_api_base
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

# The example runs against the real API, with the released library from Maven Central.
.test_examples_base:
  stage: test
  extends: .test
  # Replaces the deepl-mock service of .test
  services: []
  variables:
    MAVEN_OPTS: -Dmaven.repo.local=.m2/repository
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd examples/maven/deepl-test-app
    - mvn install -B -PbuildProject -l mvn_build.log
    - mvn verify -PrunIntegrationTests
  artifacts:
    paths:
      - examples/maven/deepl-test-app/mvn_build.log
    when: always

test_examples_scheduled:
  extends: .test_examples_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  retry: 2

test_examples_manual:
  extends: .test_examples_base
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

# stage: publish -------------------------

.publish_base:
  stage: publish
  extends: .publish
  dependencies:
    - build_scheduled
    - build_manual
  script:
    - echo "=== Publishing to Maven Central ==="
    - echo "Runner node $(hostname)"
    - echo ""
    - echo "Step 1/2 Publishing artifacts to staging repository..."
    - ./gradlew publish --info
    - echo ""
    - echo "Step 2/2 Triggering deployment from same IP..."
    # Trigger deployment from same IP to ensure Sonatype can find the staging repository
    - ./gradlew triggerDeployment

publish:
  extends: .publish_base
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

publish_manual:
  extends: .publish_base
  when: manual
