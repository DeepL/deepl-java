# Note: This GitLab CI configuration is used for internal testing, users can ignore it.
include:
  - project: '${CI_PROJECT_NAMESPACE}/ci-libs-for-client-libraries'
    file:
      - '/${CI_PROJECT_NAME}/.gitlab-ci.yml'
  - project: 'deepl-org/deepl/devex/gitlab-ci-lib'
    file:
      - '/templates/.secret-detection.yml'
  - template: Security/SAST.gitlab-ci.yml

# Global --------------------------

# Use 17 (LTS) as base
image: eclipse-temurin:17-alpine

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  JAVA_TOOL_OPTIONS: ""
  GITLAB_ADVANCED_SAST_ENABLED: 'true'

workflow:
  rules:
    # The tag pipeline must run: that is where the registry publish job fires.
    - if: $CI_COMMIT_TAG
    # The release commit carries only the version and the changelog, both
    # derived from commits that were already checked on the way in.
    - if: $CI_COMMIT_MESSAGE =~ /^chore\(release\):/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

stages:
  - check
  - build
  - test
  - publish

before_script:
  - GRADLE_USER_HOME="$(pwd)/.gradle"
  - export GRADLE_USER_HOME

# stage: check ----------------------

.spotless_base:
  stage: check
  script: ./gradlew spotlessCheck

spotless_scheduled:
  extends: .spotless_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  retry: 2

spotless_manual:
  extends: .spotless_base
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

.license_check_base:
  stage: check
  script:
    - ./license_checker.sh '*.java' | tee license_check_output.txt
    - '[ ! -s license_check_output.txt ]'

license_check_scheduled:
  extends: .license_check_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  retry: 2

license_check_manual:
  extends: .license_check_base
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

secret_detection:
  extends: .secret-detection
  stage: check
  image: !reference [.secret-detection, image]
  variables:
    SECRET_DETECTION_HISTORIC_SCAN: "true"
  before_script:
    - echo "overriding default before_script..."
  rules:
    - if: $CI_MERGE_REQUEST_ID

gitlab-advanced-sast:
  stage: check
  rules:
    - when: always
  variables:
    SAST_EXCLUDED_PATHS: '$DEFAULT_SAST_EXCLUDED_PATHS'
    GIT_STRATEGY: clone

semgrep-sast:
  stage: check
  rules:
    - when: always
  variables:
    SAST_EXCLUDED_PATHS: '$DEFAULT_SAST_EXCLUDED_PATHS'
    GIT_STRATEGY: clone

# stage: build ----------------------

.build_base:
  stage: build
  script:
    - ./gradlew assemble
  artifacts:
    paths:
      - deepl-java/build/

build_scheduled:
  extends: .build_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  retry: 2

build_manual:
  extends: .build_base
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

# stage: test -------------------------

.test_offline_base:
  stage: test
  variables:
    KUBERNETES_MEMORY_LIMIT: 8Gi
  parallel:
    matrix:
      # LTS releases only.
      - DOCKER_IMAGE: "amazoncorretto:8-alpine"
      - DOCKER_IMAGE: "eclipse-temurin:8-focal"
      - DOCKER_IMAGE: "eclipse-temurin:11-alpine"
      - DOCKER_IMAGE: "eclipse-temurin:17-alpine"
      - DOCKER_IMAGE: "eclipse-temurin:21-alpine"
  image: ${DOCKER_IMAGE}
  script:
    # Gradle needs Java 17+. On Java 8 and 11 it runs on a downloaded Temurin 17 (the jobs
    # cannot install packages) and the tests run on the image's JVM.
    - |
      if java -version 2>&1 | grep -qE 'version "(1\.8|11)\.'; then
        IMAGE_JAVA="$(readlink -f "$(command -v java)")"
        # On musl, the Java 17 launcher puts its own libraries on LD_LIBRARY_PATH, which Gradle's
        # processes inherit, and musl searches it before the RPATH of the image's java: that
        # binary would load Java 17's libjli and start Java 17. So the tests start through a
        # wrapper that clears the variable; Gradle probes and runs <testJavaHome>/bin/java.
        TEST_JAVA_HOME="$PWD/.testjvm"
        mkdir -p "$TEST_JAVA_HOME/bin"
        printf '#!/bin/sh\nunset LD_LIBRARY_PATH\nexec "%s" "$@"\n' "$IMAGE_JAVA" > "$TEST_JAVA_HOME/bin/java"
        chmod +x "$TEST_JAVA_HOME/bin/java"
        if [ -f /etc/alpine-release ]; then OS=alpine-linux; else OS=linux; fi
        case "$(uname -m)" in aarch64) ARCH=aarch64 ;; *) ARCH=x64 ;; esac
        JDK_URL="https://api.adoptium.net/v3/binary/latest/17/ga/$OS/$ARCH/jdk/hotspot/normal/eclipse"
        mkdir -p .jdk17
        if command -v curl >/dev/null; then curl -fsSL "$JDK_URL"; else wget -qO- "$JDK_URL"; fi | tar -xz -C .jdk17
        JAVA_HOME="$(ls -d "$PWD"/.jdk17/jdk-17*)" ./gradlew offlineTest -PtestJavaHome="$TEST_JAVA_HOME"
      else
        ./gradlew offlineTest
      fi
  artifacts:
    paths:
      - deepl-java/build/reports/jacoco/offlineTestCoverage
    reports:
      coverage_report:
        coverage_format: jacoco
        path: deepl-java/build/reports/jacoco/offlineTestCoverage/offlineTestCoverage.xml
      junit:
        - deepl-java/build/test-results/offlineTest/TEST-*.xml
    when: always

test_offline_scheduled:
  extends: .test_offline_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  retry: 2

test_offline_manual:
  extends: .test_offline_base
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

# Every endpoint once against the real API; no retry, as a retry repeats every request.
.test_real_api_base:
  stage: test
  extends: .test
  variables:
    KUBERNETES_MEMORY_LIMIT: 8Gi
  image: eclipse-temurin:21-alpine
  script:
    - ./gradlew realApiTest
  artifacts:
    paths:
      - deepl-java/build/reports/jacoco/realApiTestCoverage
    reports:
      coverage_report:
        coverage_format: jacoco
        path: deepl-java/build/reports/jacoco/realApiTestCoverage/realApiTestCoverage.xml
      junit:
        - deepl-java/build/test-results/realApiTest/TEST-*.xml
    when: always

test_real_api_scheduled:
  extends: .test_real_api_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

test_real_api_manual:
  extends: .test_real_api_base
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

# The example runs against the real API, with the released library from Maven Central.
.test_examples_base:
  stage: test
  extends: .test
  variables:
    MAVEN_OPTS: -Dmaven.repo.local=.m2/repository
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd examples/maven/deepl-test-app
    - mvn install -B -PbuildProject -l mvn_build.log
    - mvn verify -PrunIntegrationTests
  artifacts:
    paths:
      - examples/maven/deepl-test-app/mvn_build.log
    when: always

test_examples_scheduled:
  extends: .test_examples_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  retry: 2

test_examples_manual:
  extends: .test_examples_base
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

# stage: publish -------------------------

.publish_base:
  stage: publish
  extends: .publish
  dependencies:
    - build_scheduled
    - build_manual
  script:
    - echo "=== Publishing to Maven Central ==="
    - echo "Runner node $(hostname)"
    - echo ""
    - echo "Step 1/2 Publishing artifacts to staging repository..."
    - ./gradlew publish --info
    - echo ""
    - echo "Step 2/2 Triggering deployment from same IP..."
    # Trigger deployment from same IP to ensure Sonatype can find the staging repository
    - ./gradlew triggerDeployment

publish:
  extends: .publish_base
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

publish_manual:
  extends: .publish_base
  when: manual
